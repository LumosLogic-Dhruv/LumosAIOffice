services:
  backend:
    build:
      context: ./ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      - PORT=8080
    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
