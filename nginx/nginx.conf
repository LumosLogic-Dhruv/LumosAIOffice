# HTTP — serves the ACME challenge and redirects everything else to HTTPS
server {
    listen 80;
    server_name aidocs.lumoslogic.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — serves both SPAs and proxies /api to the backend
server {
    listen 443 ssl;
    http2 on;
    server_name aidocs.lumoslogic.com;

    ssl_certificate     /etc/letsencrypt/live/aidocs.lumoslogic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidocs.lumoslogic.com/privkey.pem;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Platform admin SPA
    location = /platform { return 301 /platform/; }

    location /platform/ {
        try_files $uri $uri/ /platform/index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
